# ============================================================
# coturn TURN/STUN 服务器配置 (FSM-Pilot 生产环境)
# ============================================================

# 公网 IP（ECS 公网 IP 地址）
external-ip=YOUR_PUBLIC_IP

# 监听端口
listening-port=3478
alt-listening-port=3479
tls-listening-port=5349

# TLS 证书（与 Nginx 共用 Let's Encrypt 证书）
cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# Realm（域名）
realm=YOUR_DOMAIN

# 服务器名称
server-name=YOUR_DOMAIN

# TURN relay 地址范围（必须与 ECS 安全组开放一致）
min-port=49152
max-port=65535

# ── 认证方式：时间限制 HMAC token（推荐）──────────────────
# 车端和操作端动态申请有效期 30 分钟的 TURN 凭证
use-auth-secret
static-auth-secret=CHANGE_THIS_TO_STRONG_RANDOM_SECRET

# 禁用明文 UDP（强制 DTLS/TLS）
no-tlsv1
no-tlsv1_1

# 只允许 relay（不允许 loopback/local 中继，防止 SSRF）
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# 日志
log-file=/var/log/coturn/turnserver.log
log-binding
