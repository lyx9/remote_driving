# ============================================================
# FSM-Pilot 阿里云生产环境 Docker Compose
# 包含: cloud_server / coturn / nginx / emqx (MQTT broker)
#
# 运行方式 (由 deploy.sh 自动调用，也可手动):
#   cd /opt/fsm && docker compose up -d
#
# 所有运行时配置文件位于 ./configs/ (由 deploy.sh 生成):
#   cloud_config.yaml  nginx.conf  turnserver.conf
# ============================================================

version: "3.9"

networks:
  fsm_internal:
    driver: bridge

volumes:
  letsencrypt:
  coturn_data:
  emqx_data:
  emqx_log:

services:

  # ── EMQX MQTT Broker ───────────────────────────────────────
  # 企业级 MQTT 5.0 broker，支持百万级并发连接。
  # 初始管理台账号 admin / public — 首次登录后请立即修改密码！
  # Dashboard: http://<PUBLIC_IP>:18083  (本地 SSH 转发: ssh -L 18083:localhost:18083 user@ecs)
  emqx:
    image: emqx/emqx:5.6
    container_name: fsm_emqx
    restart: unless-stopped
    networks:
      - fsm_internal
    ports:
      - "1883:1883"     # MQTT TCP
      - "8883:8883"     # MQTT TLS
      - "8083:8083"     # MQTT over WebSocket
      - "8084:8084"     # MQTT over WebSocket TLS
      - "18083:18083"   # Dashboard (生产环境应通过 SSH 隧道访问)
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - TZ=Asia/Shanghai
      - EMQX_NODE__NAME=emqx@127.0.0.1
      # 匿名访问控制 (EMQX 5.x): 配置认证后自动生效
      - EMQX_MQTT__ALLOW_ANONYMOUS=true    # 部署后通过 Dashboard 关闭
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── 信令/调度/告警/REST API 服务 ─────────────────────────
  fsm_cloud:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fsm-pilot-cloud:latest
    container_name: fsm_cloud
    restart: unless-stopped
    networks:
      - fsm_internal
    volumes:
      # configs/ 由 deploy.sh 从模板生成并替换占位符
      - ./configs/cloud_config.yaml:/etc/fsm/cloud_config.yaml:ro
      - /var/log/fsm:/var/log/fsm
    expose:
      - "8080"   # WebSocket 信令 (由 Nginx 代理)
      - "8081"   # REST API + /metrics (由 Nginx 代理)
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/8081 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── TURN/STUN WebRTC 中继 ──────────────────────────────────
  coturn:
    image: coturn/coturn:4.6
    container_name: fsm_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./configs/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_data:/var/lib/coturn
      - letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Nginx TLS 终端 + 反向代理 ─────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: fsm_nginx
    restart: unless-stopped
    networks:
      - fsm_internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      fsm_cloud:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
