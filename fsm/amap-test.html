<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Mobility - Amap配置测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            margin-bottom: 30px;
        }

        .test-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-label {
            font-weight: 600;
            color: #333;
        }

        .test-value {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #6c757d;
            color: white;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.success { color: #4ec9b0; }
        .log-entry.error { color: #f48771; }
        .log-entry.info { color: #9cdcfe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Guardian Mobility</h1>
            <p>Amap (高德地图) 配置测试工具</p>
        </div>

        <div class="content">
            <!-- 配置检查 -->
            <div class="test-section">
                <h2>📋 配置检查</h2>
                <div class="test-item">
                    <span class="test-label">API Key</span>
                    <span class="test-value" id="apiKey">检查中...</span>
                </div>
                <div class="test-item">
                    <span class="test-label">安全密钥 (JS Code)</span>
                    <span class="test-value" id="jsCode">检查中...</span>
                </div>
                <div class="test-item">
                    <span class="test-label">配置状态</span>
                    <span class="status pending" id="configStatus">检查中...</span>
                </div>
            </div>

            <!-- API测试 -->
            <div class="test-section">
                <h2>🔌 API连接测试</h2>
                <div class="test-item">
                    <span class="test-label">Amap脚本加载</span>
                    <span class="status pending" id="scriptStatus">等待测试...</span>
                </div>
                <div class="test-item">
                    <span class="test-label">地图初始化</span>
                    <span class="status pending" id="mapStatus">等待测试...</span>
                </div>
                <div class="test-item">
                    <span class="test-label">标记功能</span>
                    <span class="status pending" id="markerStatus">等待测试...</span>
                </div>
            </div>

            <!-- 地图显示 -->
            <div class="test-section">
                <h2>🗺️ 地图显示测试</h2>
                <div id="map"></div>

                <div class="button-group">
                    <button class="primary" onclick="testMap()">🚀 开始测试</button>
                    <button class="secondary" onclick="addTestMarkers()">📍 添加测试标记</button>
                    <button class="secondary" onclick="clearMap()">🗑️ 清除地图</button>
                </div>
            </div>

            <!-- 日志 -->
            <div class="test-section">
                <h2>📝 测试日志</h2>
                <div class="log" id="log"></div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const API_KEY = 'fa4c4bc1d796891d00472871682f6628';
        const JS_CODE = '215104d11967ff4b9b17366e0bd56f0f';

        let map = null;
        let markers = [];

        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // 更新状态
        function updateStatus(id, text, success) {
            const element = document.getElementById(id);
            element.textContent = text;
            element.className = `status ${success ? 'success' : 'error'}`;
        }

        // 检查配置
        function checkConfig() {
            log('开始检查配置...', 'info');

            document.getElementById('apiKey').textContent = API_KEY.substring(0, 10) + '...';
            document.getElementById('jsCode').textContent = JS_CODE.substring(0, 10) + '...';

            if (API_KEY && JS_CODE) {
                updateStatus('configStatus', '✅ 配置完整', true);
                log('配置检查通过', 'success');
                return true;
            } else {
                updateStatus('configStatus', '❌ 配置缺失', false);
                log('配置检查失败：缺少API密钥', 'error');
                return false;
            }
        }

        // 加载Amap脚本
        function loadAmapScript() {
            return new Promise((resolve, reject) => {
                log('正在加载Amap脚本...', 'info');

                // 设置安全配置
                window._AMapSecurityConfig = {
                    securityJsCode: JS_CODE
                };
                log('安全配置已设置', 'success');

                // 检查是否已加载
                if (window.AMap) {
                    log('Amap已加载', 'success');
                    updateStatus('scriptStatus', '✅ 已加载', true);
                    resolve();
                    return;
                }

                // 加载脚本
                const script = document.createElement('script');
                script.src = `https://webapi.amap.com/maps?v=2.0&key=${API_KEY}&plugin=AMap.Marker,AMap.InfoWindow`;

                script.onload = () => {
                    log('Amap脚本加载成功', 'success');
                    updateStatus('scriptStatus', '✅ 加载成功', true);
                    resolve();
                };

                script.onerror = () => {
                    log('Amap脚本加载失败', 'error');
                    updateStatus('scriptStatus', '❌ 加载失败', false);
                    reject(new Error('脚本加载失败'));
                };

                document.head.appendChild(script);
            });
        }

        // 初始化地图
        function initMap() {
            return new Promise((resolve, reject) => {
                try {
                    log('正在初始化地图...', 'info');

                    map = new AMap.Map('map', {
                        zoom: 12,
                        center: [114.1694, 22.3193], // 香港尖沙咀
                        mapStyle: 'amap://styles/darkblue',
                        viewMode: '2D'
                    });

                    map.on('complete', () => {
                        log('地图初始化成功 - 中心: 香港尖沙咀', 'success');
                        updateStatus('mapStatus', '✅ 初始化成功', true);
                        resolve();
                    });

                } catch (error) {
                    log(`地图初始化失败: ${error.message}`, 'error');
                    updateStatus('mapStatus', '❌ 初始化失败', false);
                    reject(error);
                }
            });
        }

        // 添加测试标记
        function addTestMarkers() {
            if (!map) {
                log('请先初始化地图', 'error');
                return;
            }

            log('正在添加测试标记...', 'info');

            // 清除旧标记
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            // 测试位置（香港不同区域）
            const testLocations = [
                { name: '尖沙咀', pos: [114.1694, 22.3193], color: '#ff3333' },
                { name: '中环', pos: [114.1577, 22.2855], color: '#33ff99' },
                { name: '铜锣湾', pos: [114.1849, 22.2783], color: '#ffdd33' },
                { name: '旺角', pos: [114.1692, 22.3193], color: '#ff9933' }
            ];

            testLocations.forEach(loc => {
                const marker = new AMap.Marker({
                    position: loc.pos,
                    title: loc.name,
                    label: {
                        content: loc.name,
                        direction: 'top'
                    }
                });

                marker.setMap(map);
                markers.push(marker);

                log(`添加标记: ${loc.name}`, 'success');
            });

            updateStatus('markerStatus', '✅ 标记添加成功', true);
            log(`成功添加 ${testLocations.length} 个测试标记`, 'success');
        }

        // 清除地图
        function clearMap() {
            if (!map) return;

            markers.forEach(marker => marker.setMap(null));
            markers = [];

            log('地图已清除', 'info');
            updateStatus('markerStatus', '⏸️ 已清除', false);
        }

        // 主测试函数
        async function testMap() {
            log('========== 开始测试 ==========', 'info');

            try {
                // 1. 检查配置
                if (!checkConfig()) {
                    throw new Error('配置检查失败');
                }

                // 2. 加载脚本
                await loadAmapScript();

                // 3. 初始化地图
                await initMap();

                // 4. 添加测试标记
                setTimeout(() => {
                    addTestMarkers();
                    log('========== 测试完成 ==========', 'success');
                    log('✅ 所有测试通过！地图功能正常', 'success');
                }, 1000);

            } catch (error) {
                log(`测试失败: ${error.message}`, 'error');
                log('========== 测试失败 ==========', 'error');
            }
        }

        // 页面加载时检查配置
        window.onload = () => {
            checkConfig();
            log('测试工具已就绪，点击"开始测试"按钮开始', 'info');
        };
    </script>
</body>
</html>
